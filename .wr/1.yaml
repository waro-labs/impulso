issue: 1
title: "BRIEF: Parametrizar licencia Open Source (MIT libre uso)"
repo: impulso
repo_remote: waro-labs/impulso
cwd: /tmp/impulso-plan
stack: static
branch: wr-1-mit-license
worktree: /tmp/impulso-plan

paths:
  - LICENSE
  - README.md
  - sitio/index.html

ac:
  - LICENSE MIT 2026 existe con Copyright (c) 2026 DJ CAS / Waro Labs
  - README.md badge MIT + seccion Licencia (MIT para codigo + SIL OFL 1.1 Anton/Space Grotesk ref LICENCIAS-TERCEROS.txt)
  - sitio/index.html comentario SPDX-License-Identifier: MIT + OFL-1.1 en <head> sin cambiar JS/CSS
