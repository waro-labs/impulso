  pattern: "LICENSE MIT template + warolabs-server-infra LICENSE-less model; sitio/index.html:4 ya usa SIL OFL comment"
  tests: "gh api repos/waro-labs/impulso/license --jq .license.key"
  lessons: "grep -r MIT .agent-memory/lessons 2>/dev/null | head; cat LICENCIAS-TERCEROS.txt"

lessons_checked:
  - query: "MIT license impulso"
    hit: false
    reused: ""

risk:
  sensitive: false
  areas: ["legal/docs"]

skip:
  audits: []

next:
  after_pr: "gh pr create --repo waro-labs/impulso --title 'chore: MIT license libre uso' --body 'Closes #1'"
